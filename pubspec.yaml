name: restaurant_app
description: Wasi - Sistema de gestión de restaurante
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # HTTP & Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  fluttertoast: ^8.2.8
  percent_indicator: ^4.2.3
  qr_flutter: ^4.1.0

  # Utils
  intl: ^0.20.2

  # Impresión Bluetooth (respaldo cuando falla la conexión por IP)
  print_bluetooth_thermal: ^1.1.0
  permission_handler: ^11.3.1

  # Descubrimiento de impresoras de red por mDNS/Bonjour
  multicast_dns: ^0.3.2

  # Abrir el RIDE (PDF) de la factura electrónica en el navegador
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  # El icono y el splash los consumen flutter_launcher_icons y
  # flutter_native_splash en tiempo de build, no se empaquetan como assets.

# Ícono de la app, generado desde LogoWasi.png (ver assets/icon/). Regenerar
# con: dart run flutter_launcher_icons
#  - icon.png: fondo crema a sangre y sin alfa (iOS lo exige) — el sistema
#    aplica su propia máscara, por eso no lleva esquinas redondeadas.
#  - icon_foreground.png: solo el símbolo, al 66% de la imagen. El XML del
#    ícono adaptativo le aplica un inset del 16%, así que termina en ~45%
#    del lienzo de 108dp: dentro del círculo seguro de 66dp y del tamaño
#    habitual de un ícono.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FBE9D6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"  # simbolo al 66% (el XML aplica inset 16% -> ~45% del lienzo 108dp)
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21

# Pantalla de arranque (antes quedaba en blanco). Regenerar con:
#   dart run flutter_native_splash:create
# El mismo crema del ícono en claro y oscuro: el arranque no debe cambiar
# de color según el tema del celular.
flutter_native_splash:
  color: "#FBE9D6"
  color_dark: "#FBE9D6"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash.png
  android: true
  ios: true
  web: false
  # Android 12+ dibuja el splash con su propia API: lienzo de 1152 px con el
  # contenido dentro de un círculo de 768 px, por eso lleva su propia imagen.
  android_12:
    color: "#FBE9D6"
    color_dark: "#FBE9D6"
    image: assets/splash/splash_android12.png
    image_dark: assets/splash/splash_android12.png
    icon_background_color: "#FBE9D6"
    icon_background_color_dark: "#FBE9D6"
