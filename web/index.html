<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wasi: pedidos, cobro, inventario y reportes del restaurante.">
  <meta name="theme-color" content="#5D4037">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wasi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wasi</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Pantalla de carga mientras baja la app (unos segundos la primera vez).
    Sin esto se veía la página en blanco. Se quita sola con el primer cuadro
    que dibuja Flutter (evento flutter-first-frame).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #FBE9D6; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FBE9D6; transition: opacity .25s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6D4C41; font-size: 14px;
    }
    #carga img { width: 84px; height: 84px; border-radius: 22px; }
    #carga .barra { width: 140px; height: 4px; border-radius: 2px; background: #EDE0D4; overflow: hidden; }
    #carga .barra span {
      display: block; width: 40%; height: 100%; border-radius: 2px; background: #5D4037;
      animation: carga 1.1s ease-in-out infinite;
    }
    @keyframes carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #carga .barra span { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-label="Cargando Wasi">
    <img src="icons/Icon-192.png" alt="">
    <div class="barra"><span></span></div>
    <div>Cargando Wasi…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
