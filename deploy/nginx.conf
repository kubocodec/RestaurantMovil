server {
    listen 80;
    # IPv6 también: dentro del contenedor `localhost` resuelve antes a ::1, y
    # sin esta línea cualquier cliente local —empezando por el HEALTHCHECK—
    # recibe "connection refused" aunque nginx esté perfectamente vivo en IPv4.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter NO pone hash en los nombres (main.dart.js, flutter_bootstrap.js,
    # canvaskit/, AssetManifest…) y desde 3.4x ya no trae service worker que
    # avise de una versión nueva. Con la caché de 30 días que había antes, el
    # navegador se quedaba con la app vieja hasta un mes después de cada
    # despliegue. `no-cache` no es "no guardar": guarda, pero pregunta antes de
    # usar; si el archivo no cambió, nginx contesta 304 sin mandarlo de nuevo.
    #
    # Ojo: un `location` con su propio add_header NO hereda este. Por eso los
    # tres de abajo (index.html, service worker, version.json) llevan el suyo.
    add_header Cache-Control "no-cache";

    # Lo que mira el healthcheck del contenedor y el Action al terminar.
    # Un index.html también serviría, pero esto deja el log limpio y no
    # depende de que la app compile bien.
    # default_type y no add_header: `return` ya manda un Content-Type (el de
    # default_type, application/octet-stream), así que el add_header AÑADE
    # una segunda cabecera en vez de reemplazarla.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hoy go_router usa rutas con almohadilla (/#/mesas), así que el navegador
    # nunca pide una ruta de la app al servidor. Esto queda por si algún día
    # se pasa a rutas limpias: sin ello, recargar /mesas daría 404 porque
    # nginx buscaría un archivo que no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estos tres NUNCA se cachean: son los que le avisan al navegador de que
    # hay un despliegue nuevo. Si se cachean, el cajero sigue viendo la
    # versión vieja hasta que borre los datos del sitio.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
